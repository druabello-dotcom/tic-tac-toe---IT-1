<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tic Tac Toe</title>
	<link rel="stylesheet" href="style.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">

</head>
<body>

	<section id="main">
		<div id="game-wrapper">
			<div id="display-player-turn">
				<p>Player turn:</p>
				<p id="player-turn-indicator" class="playerX">X</p>
			</div>
			<div id="game-board">
			</div>
		</div>
	</section>
	
	<div id="declare-winner-tab">
		<div id="victory-announcer">
			<h1>WON</h1> <!-- announcing winner here -->
		</div>
		<div id="reset-game-dwt">
			<button type="button" class="reset-game" id="rg-dwt">
				<div class="top-layer-button" id="tlb-dwt">RESET GAME</div>
				<div class="bottom-layer-button" id="blb-dwt"></div>
			</button>
		</div>
	</div>
	
	<script type="module" src="main.js"></script>
</body>
</html>
